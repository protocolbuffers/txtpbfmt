syntax = "proto3";

package testproto;

option go_package = "github.com/protocolbuffers/txtpbfmt/testdata";

message UserProfile {
  int32 id = 1;
  int32 priority = 2;
  string email = 3;
  string name = 5;
  bool active = 7;
  
  Level1Config config = 10;
}

message ProductCatalog {
  int32 id = 1;
  bool enabled = 2;
  string name = 3;
  int32 priority = 4;
}

message Level1Config {
  message Level2Config {
    string name = 1;
    string value = 2;
    bool active = 3;
    int32 priority = 4;
  }

  int32 id = 1;
  bool enabled = 2;
  string name = 3;
  int32 priority = 4;
  
  Level2Config level2 = 5;
}
